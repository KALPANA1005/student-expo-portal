<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Expo Portal - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <div class="logo">🎓</div>
  <h2>Project Expo Portal</h2>
  <p class="subtitle">Sign in to continue to your dashboard</p>

  <div class="tabs">
    <button class="tab active" data-role="student" onclick="selectRole('student', this)">🎓 Student</button>
    <button class="tab" data-role="admin" onclick="selectRole('admin', this)">🛡️ Admin</button>
    <button class="tab" data-role="judge" onclick="selectRole('judge', this)">⚖️ Judge</button>
  </div>

  <div class="error" id="errorBox"></div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <label>Email address</label>
    <input type="email" id="email" placeholder="student@gmail.com" required>

    <label>Password</label>
    <input type="password" id="password" placeholder="Enter your password" required>

    <button type="submit" class="submit" id="submitBtn">Sign in as Student</button>
  </form>

  <p class="footer">Don't have an account? <a href="register-student.html">Register as Student</a></p>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
